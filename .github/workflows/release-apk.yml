name: Build signed release APK

# Produces the APK intended for other people, signed with a real key so that
# updates install over previous versions. Runs only when a version tag is
# pushed, so publishing is a deliberate act rather than a side effect of every
# commit - the rolling debug build already covers day-to-day testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check app references resolve
        run: python3 tools/check-app-references.py

      - name: Core protocol tests
        run: ./gradlew :core:test

      # The keystore lives only in the secret and only for this job. Writing it
      # outside the workspace keeps it out of anything the build might archive.
      - name: Materialise the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set. Add the four signing secrets" >&2
            echo "before tagging a release - see docs/RELEASING.md." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Confirm it is actually signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "truckscan-${VERSION}.apk"
          gh release create "$VERSION" "truckscan-${VERSION}.apk" \
            --title "Truck Scan $VERSION" \
            --notes "Signed release build. Install on any Android 8.0 or newer phone. Android will warn about an unknown source because the app is not distributed through the Play Store."

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
