name: Build signed release APK

# Produces the APK intended for other people, signed with a real key so that
# updates install over previous versions. Runs only when a version tag is
# pushed, so publishing is a deliberate act rather than a side effect of every
# commit - the rolling debug build already covers day-to-day testing.
on:
  # Three ways in, because pushing a tag is not always available: a
  # restricted credential can be allowed to push branches and refused on
  # refs/tags entirely. All three land in the same job, and the job creates
  # the tag itself from the commit it built, so the result is identical.
  push:
    # The normal path.
    tags: ["v*"]
    # The fallback: a branch named for the version, e.g. release/v1.0.0.
    # Creating one is as deliberate as tagging, and needs only branch
    # permission. The branch is disposable - the tag is what persists.
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check app references resolve
        run: python3 tools/check-app-references.py

      - name: Core protocol tests
        run: ./gradlew :core:test

      # The keystore lives only in the secret and only for this job. Writing it
      # outside the workspace keeps it out of anything the build might archive.
      - name: Materialise the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set. Add the four signing secrets" >&2
            echo "before releasing - see docs/RELEASING.md." >&2
            exit 1
          fi

          # Keep only the base64 alphabet before decoding. Encoded text picks
          # up line wrapping, stray spaces, and - the one that actually bit us
          # - UTF-16, which is what Windows PowerShell writes from > and
          # Out-File. Every one of those decodes to the identical keystore
          # once the noise is gone, and nothing incorrect can slip through:
          # the keytool checks below have to pass afterwards.
          printf '%s' "$KEYSTORE_BASE64" \
            | tr -cd 'A-Za-z0-9+/=' \
            | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null || true

          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "KEYSTORE_BASE64 is set but did not decode to anything." >&2
            echo "Re-encode the keystore and paste it again - see" >&2
            echo "docs/RELEASING.md." >&2
            exit 1
          fi

          # keytool is the authority on whether this is a usable keystore:
          # it reads PKCS12 and JKS alike, and only succeeds if the password
          # is right. Ask it first, and inspect the bytes only to explain a
          # failure - an earlier version tested for PKCS12's DER magic up
          # front and would have rejected a perfectly good JKS.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass:env KEYSTORE_PASSWORD >/dev/null 2>&1; then
            MAGIC=$(head -c4 "$RUNNER_TEMP/release.jks" | od -An -tx1 | tr -d ' \n')
            case "$MAGIC" in
              3082*|feedfeed)
                echo "This is a keystore, but KEYSTORE_PASSWORD does not open" >&2
                echo "it. PKCS12 keystores use one password for both the" >&2
                echo "store and the key, so KEYSTORE_PASSWORD and" >&2
                echo "KEY_PASSWORD must hold the same value." >&2
                ;;
              *)
                echo "KEYSTORE_BASE64 decoded, but not to a keystore." >&2
                # Base64 of a keystore starts 'MII' (PKCS12) or '/u3+' (JKS),
                # so seeing that here means the value was encoded twice -
                # easily done by encoding the .b64 file rather than the .jks.
                case "$(head -c4 "$RUNNER_TEMP/release.jks")" in
                  MII*|/u3+)
                    echo "It decoded to more base64, so it was encoded twice." >&2
                    echo "Encode truckscan-release.jks itself, not the file" >&2
                    echo "holding its base64." >&2
                    ;;
                  *)
                    echo "Check you encoded truckscan-release.jks and not" >&2
                    echo "some other file - see docs/RELEASING.md." >&2
                    ;;
                esac
                ;;
            esac
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass:env KEYSTORE_PASSWORD \
                 -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "The keystore opened, but holds no key by that alias." >&2
            echo "KEY_ALIAS must match the -alias given to keytool." >&2
            exit 1
          fi

          echo "Keystore decoded and verified: opens with KEYSTORE_PASSWORD," >&2
          echo "and contains the key '$KEY_ALIAS'." >&2

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Confirm it is actually signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag push gives the version directly; a release/v1.0.0 branch
          # gives it after the prefix; a dispatch supplies it as input.
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#release/}"

          # Refuse anything that is not a version. A dispatch input is free
          # text, and a typo here becomes a permanent public tag.
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a version: '$VERSION'. Expected something like v1.0.0." >&2
            exit 1
          fi

          # Never quietly replace a release people may already have
          # downloaded. Re-pushing a release branch is an easy accident;
          # silently rewriting v1.0.0 underneath someone is not recoverable.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Bump the version rather" >&2
            echo "than republishing one that is already public." >&2
            exit 1
          fi

          cp app/build/outputs/apk/release/app-release.apk "truckscan-${VERSION}.apk"
          gh release create "$VERSION" "truckscan-${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Truck Scan $VERSION" \
            --notes-file - <<'NOTES'
          Signed release build. Requires Android 8.0 or newer.

          ## Installing

          1. Tap the `.apk` file in the Assets list below to download it.
          2. Android will block the install and offer a settings toggle called
             **Install unknown apps** - grant it to whatever app is doing the
             downloading (usually Chrome or Files), go back, tap the file again.
          3. Play Protect will note the app was not scanned. That is about where
             the app came from, not what is in it: anything outside the Play
             Store gets the same warning.

          If you previously installed a `truckscan-debug` build, **uninstall it
          first**. Debug builds are signed with a different key and Android will
          not update across keys.

          ## What it does

          Reads your truck. Module discovery across all four CAN buses, fault
          codes with Ford failure types, live data with warning thresholds for
          things like coolant temperature, and As-Built configuration backup.

          It does not write to any module. See the README for why, and for which
          adapter you need - a generic ELM327 clone reaches only the engine and
          transmission and will make the truck look like it has nothing else.

          Built for a 2022 F-250 Super Duty. No warranty; see LICENSE.
          NOTES

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
