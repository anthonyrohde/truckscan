org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

# Compile Kotlin inside the Gradle JVM rather than spawning a separate Kotlin
# daemon. The extra daemon is a memory win on a big multi-module build but is
# fragile in constrained containers and CI runners, and this project is small
# enough that in-process costs nothing.
kotlin.compiler.execution.strategy=in-process

kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
